name: 发布报表到 Pages

on:
  # 首次发布/补发时手动点一下
  workflow_dispatch:
  # 每次「采集积存金价格」跑完就跟着重新发布，不用另设 cron，天然和数据同步
  workflow_run:
    workflows: ["采集黄金实时金价"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 采集失败时不发布
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # ⚠️ enablement: true 实测会被拒（403）：创建 Pages 站点需要仓库【管理员】权限，
          # collaborator 的 Write 权限不够。所以站点必须先由仓库主人在设置里开一次：
          #   Settings → Pages → Source 选「GitHub Actions」
          # 之后本 workflow 才能正常部署。若主人选的是「Deploy from a branch / main / root」，
          # 则改用分支发布（仓库根目录的 index.html 会被直接当作站点），本文件可删除。
          enablement: true

      - name: 只用报表本身做站点
        run: |
          mkdir -p _site
          cp report.html _site/index.html
          echo "站点内容：$(ls -la _site | tail -n +2 | wc -l | tr -d ' ') 个文件，"\
               "$(wc -c < _site/index.html | tr -d ' ') 字节"

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
