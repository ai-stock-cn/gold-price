name: 发布报表到 Pages

on:
  # 首次发布/补发时手动点一下
  workflow_dispatch:
  # 每次「采集黄金实时金价」跑完就跟着重新发布，不用另设 cron，天然和数据同步。
  workflow_run:
    workflows: ["采集黄金实时金价"]
    types: [completed]
    branches: [main]
  # Actions 模式的 Pages 只能靠 workflow 发布，所以数据一变就重新部署
  push:
    branches: [main]
    paths:
      - "report.html"
      - "index.html"
      - ".nojekyll"
      - ".github/workflows/pages.yml"   # 改了这个文件本身也要重新部署一次
      - ".github/workflows/pages.yml"   # 改了这个文件本身也要重新部署一次

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 两个仓库共用这份文件，但只有 ai-stock-cn 用 Actions 部署；
    # bang325/gold-price 走分支发布（根目录 index.html），这里直接跳过，避免每次红一条。
    # 另：采集失败时不发布。
    if: |
      github.repository == 'ai-stock-cn/gold-price' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        # 不要加 enablement: true —— 它需要仓库管理员权限。Pages 由主人开过一次之后，
        # 这里只做「读取站点元信息」，collaborator 的 Write 权限足够。
        # 若站点后来被关掉，这一步会报错，届时让主人重新开一次即可。

      - name: 只用报表本身做站点
        run: |
          mkdir -p _site
          cp report.html _site/index.html
          echo "站点内容：$(ls -la _site | tail -n +2 | wc -l | tr -d ' ') 个文件，"\
               "$(wc -c < _site/index.html | tr -d ' ') 字节"

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
