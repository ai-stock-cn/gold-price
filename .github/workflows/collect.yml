name: 采集积存金价格

on:
  # 只保留「定时」和「手动」两种触发。
  # 曾经加过 push 触发做连通性冒烟测试，但它会形成开环：push → 触发生成数据提交 →
  # 下一次 push 被拒 → 又要 rebase，来回打转。要测就用 Actions 页面的 Run workflow。
  schedule:
    # 每 5 分钟一次（GitHub 允许的最小间隔），288 次/天，含周末。
    # ⚠️ 代价：每次运行都会产生一次提交，一天 ~288 次。仓库历史会变密。
    #    嫌吵就把这里和 config.json 的 slot_step_minutes 一起改成 15 / 30。
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略周末与时段判断，强制采集一次（用于测试源站连通性）"
        type: boolean
        default: false

# 需要把新数据提交回仓库
permissions:
  contents: write

# 上一轮没跑完就别开新的，避免两个 job 同时改 CSV 产生冲突
concurrency:
  group: gold-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 关键：脚本用 datetime.now() / date.today() 判断时点，
      # runner 默认 UTC，不设这个会把 09:00 记成 01:00。
      TZ: Asia/Shanghai

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 环境自检
        run: |
          echo "容器时区: $(date '+%Y-%m-%d %H:%M:%S %A %Z')"
          echo "Python: $(python3 -V)"
          # 探测两个国内数据源在海外 runner 上是否可达，结果落盘到 data/smoke.json
          # 目的是能事后检查：GitHub 的 runner 在海外，国内站点有可能连不上。
          python3 - <<'PY'
          import json, os, ssl, time, urllib.request, datetime

          def probe(url, data=None, headers=None):
              t0 = time.time()
              try:
                  req = urllib.request.Request(
                      url, data=data,
                      headers=headers or {"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=25,
                                              context=ssl.create_default_context()) as r:
                      body = r.read(400)
                  return {"ok": True, "code": r.status,
                          "sec": round(time.time() - t0, 2),
                          "head": body[:160].decode("utf-8", "ignore")}
              except Exception as e:
                  return {"ok": False, "sec": round(time.time() - t0, 2),
                          "err": f"{type(e).__name__}: {e}"[:200]}

          out = {
              "at": datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
              "tz": os.environ.get("TZ"),
              "source": probe("https://www.chnau99999.com/page/goldPrice"),
              "sge": probe("https://www.sge.com.cn/graph/Dailyhq",
                           data=b"instid=Au99.99",
                           headers={"Content-Type": "application/x-www-form-urlencoded",
                                    "User-Agent": "Mozilla/5.0"}),
          }
          print(json.dumps(out, ensure_ascii=False, indent=1))
          os.makedirs("data", exist_ok=True)
          with open("data/smoke.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=1)
          PY

      - name: 采集并生成报表
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "强制模式"
            python3 collect.py --force --auto
          else
            python3 collect.py --auto
          fi

      - name: 生成 Pages 入口
        run: |
          # GitHub Pages 在分支根目录默认找 index.html，只有 report.html 会 404
          cp report.html index.html

      - name: 提交数据
        run: |
          git config user.name  "gold-price-bot"
          git config user.email "bang325@163.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本轮无数据变化，不提交。"
            exit 0
          fi
          git commit -m "data: $(date '+%Y-%m-%d %H:%M') 采集"
          # 极少情况下远端被别处改动，先 rebase 再推
          git pull --rebase --autostash || true
          git push

      - name: 失败时输出日志
        if: failure()
        run: |
          echo "=== data/run.log 末尾 ==="
          tail -40 data/run.log 2>/dev/null || echo "无日志"
