name: 采集黄金实时金价
# 探针：用于验证 push 触发是否生效（2026-10-31）

on:
  # 【诊断用】只在 workflow 文件自身被改动时触发，用来验证这份文件对 GitHub 是否有效。
  # 限定 paths，机器人提交数据不会命中，因此不会形成「push ↔ 数据提交」的开环。
  # 确认定时任务恢复正常后可以删掉这三行。
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
  schedule:
    # 每 15 分钟一次，96 次/天，含周末。
    # ⚠️ 必须和 config.json 的 slot_step_minutes 保持同步，否则采集次数与统计时点对不上。
    #    想更密就 5（288 次/天，GitHub 允许的最小间隔）；更稀就 30（48 次/天）。
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略周末与时段判断，强制采集一次（用于测试源站连通性）"
        type: boolean
        default: false

# 需要把新数据提交回仓库
permissions:
  contents: write

# 上一轮没跑完就别开新的，避免两个 job 同时改 CSV 产生冲突
concurrency:
  group: gold-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 关键：脚本用 datetime.now() / date.today() 判断时点，
      # runner 默认 UTC，不设这个会把 09:00 记成 01:00。
      TZ: Asia/Shanghai

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 环境自检
        run: |
          echo "容器时区: $(date '+%Y-%m-%d %H:%M:%S %A %Z')"
          echo "Python: $(python3 -V)"
          # 探测两个数据源是否可达，结果写 data/smoke.json。
          # ⚠️ 探测逻辑放在 Python 里（collect.py --smoke），绝不要在 workflow 里写
          #    shell heredoc：2026-10-31 实测，一个 `python3 - <<'PY'` 内联块让整份
          #    workflow 静默失效 —— push 和 schedule 都不再产生任何运行，且无任何报错。
          python3 collect.py --smoke

      - name: 采集并生成报表
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "强制模式"
            python3 collect.py --force --auto
          else
            python3 collect.py --auto
          fi

      - name: 生成 Pages 入口
        run: |
          # GitHub Pages 在分支根目录默认找 index.html，只有 report.html 会 404
          cp report.html index.html

      - name: 提交数据
        run: |
          git config user.name  "gold-price-bot"
          git config user.email "bang325@163.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本轮无数据变化，不提交。"
            exit 0
          fi
          git commit -m "data: $(date '+%Y-%m-%d %H:%M') 采集"
          # 极少情况下远端被别处改动，先 rebase 再推
          git pull --rebase --autostash || true
          git push

      - name: 失败时输出日志
        if: failure()
        run: |
          echo "=== data/run.log 末尾 ==="
          tail -40 data/run.log 2>/dev/null || echo "无日志"
