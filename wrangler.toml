# Cloudflare Workers 配置
# 仓库已接入 Workers Builds：push 到 main 后它会执行 `npx wrangler deploy`，
# 读这个文件决定部署哪个脚本。Worker 名称要和 Cloudflare 上那个项目一致，
# 否则会新建一个而不是更新原来的。

name = "gold-price"
main = "worker/dispatch.js"
compatibility_date = "2025-01-01"

# 环境变量请在 Cloudflare 面板的 Settings → Variables and Secrets 里配置，
# 不要写进这个文件（会被提交到公开仓库）：
#   GH_TOKEN        Secret（可选，用于触发 GitHub 重建报表）
#   ALLOW_ORIGIN    Text
#   PUSHPLUS_TOKEN  Secret（低位提醒推送到微信；不配就不推）

# 定时触发器：每 5 分钟一次。
#   · 每次都跑「低位提醒」判断（价格 5 分钟粒度，够抓住日内低点）
#     但只在周一至周五 07:00–20:00（北京时间）才推，窗外静默（判断在代码里做）
#   · 只有整 15 分钟才调 GitHub workflow_dispatch（避免 Actions 被刷成 3 倍）
# 时区是 UTC，*/5 与北京时间的整刻对齐（偏移 8 小时是整小时）。
[triggers]
crons = ["*/5 * * * *"]

# KV：提醒状态（档位/当日低点/去重计数）+ 30 日高低缓存
# 之前这个绑定是在面板里加的，2026-11-23 发现被 Deploy Hook 的部署抹掉了，
# 导致提醒退化成"无记忆"（每次都可能重复推）。写进配置里就不会再丢。
[[kv_namespaces]]
binding = "GOLD_KV"
id = "554b51cff0274abc94c6bd0e5b66a801"

# 允许跨域的前端来源（报表页面点「刷新到最新」时会调这个 Worker）
[vars]
ALLOW_ORIGIN = "https://ai-stock-cn.github.io"
